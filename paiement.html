<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paiement DTM</title>
<style>body{font-family:sans-serif; background:#f5f5f5; display:flex; justify-content:center; padding:20px}.card{background:white; padding:25px; border-radius:16px; max-width:420px; width:100%; box-shadow:0 4px 15px rgba(0,0,0,.1)}</style>
</head>
<body>
<div class="card">
<h2>Finalisez votre paiement</h2>
<p id="info"></p>
<div style="background:#fff7ed; padding:15px; border-radius:10px; border:1px solid #fdba74; margin:15px 0">
<p><b style="color:#ea580c">Orange Money:</b> <br><span style="font-size:22px; font-weight:bold">+243852862455</span></p>
<p><b>Montant:</b> <span id="mnt"></span> $</p>
<p><b>Référence:</b> <b id="ref"></b></p>
</div>
<button id="btn" style="width:100%; padding:14px; background:#25D366; color:white; border:none; border-radius:10px; font-weight:bold">J'ai payé, envoyer la preuve sur WhatsApp</button>
<div id="msg" style="display:none; background:#dcfce7; padding:15px; border-radius:10px; text-align:center; margin-top:15px">
<b>Merci! Preuve envoyée.</b><br><br>Restez sur WhatsApp, on valide votre paiement dans 2-3 min et votre billet va se débloquer tout seul.
</div>
<p style="font-size:12px; color:#666; margin-top:15px; text-align:center">Page en attente de validation...</p>
</div>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbwg_e-BcmGGAlTpBUpG_gkfp8lecKbgrRJRFi0sjcthkZeNJzjU8NlTi47cLsunscY5/exec";
const p = new URLSearchParams(location.search);
const id = p.get('id'); const nom = p.get('nom'); const montant = p.get('montant')||'';
document.getElementById('ref').textContent = id;
document.getElementById('mnt').textContent = montant;
document.getElementById('info').textContent = `Commande ${id} pour ${nom}`;
document.getElementById('btn').onclick = () => {
  fetch(SHEET_URL, {method:"POST", mode:"no-cors", body:JSON.stringify({id:id, action:"preuve_envoyee"})});
  const msg = `Bonjour DTM, j'ai payé.%0A%0AID: ${id}%0ANom: ${nom}%0AMontant: ${montant}$%0A%0AJe joins la capture Orange Money.`;
  window.open(`https://wa.me/243852862455?text=${msg}`, "_blank");
  document.getElementById('btn').style.display='none';
  document.getElementById('msg').style.display='block';
  setInterval(()=>{
    fetch(`${SHEET_URL}?id=${id}`).then(r=>r.json()).then(d=>{
      if(d.statut==='Payé'){ window.location.href = `ticket.html?id=${id}&nom=${encodeURIComponent(nom)}`; }
    });
  }, 5000);
}
</script>
</body>
</html>
