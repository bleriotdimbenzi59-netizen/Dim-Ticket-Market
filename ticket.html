<script>
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  const nom = params.get('nom') || '';
  document.getElementById('title').innerHTML = '✅ Billet Confirmé - ' + id;
  document.getElementById('details').innerHTML = `
    <p><b>Code:</b> ${id}</p>
    <p><b>Nom:</b> ${nom}</p>
    <p style="margin-top:15px; color:green">Ce billet est valide. Présentez ce code à l'entrée.</p>
    <button onclick="window.print()" style="padding:10px 15px; margin-top:10px">Imprimer</button>
  `;
</script>
