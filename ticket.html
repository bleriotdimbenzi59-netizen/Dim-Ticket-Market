<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billet DTM</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
body{font-family:sans-serif;background:#f5f5f5;margin:0;padding:20px;display:flex;justify-content:center}
.card{width:100%;max-width:380px;background:#fff;padding:24px;border-radius:20px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
.code{letter-spacing:2px;font-size:26px;font-weight:bold;margin:10px 0}
.ok{color:#16a34a}
.ko{color:#e11d48}
a.lien{display:block;margin-top:16px;color:#444}
button{margin-top:14px;padding:10px 18px;border:0;border-radius:10px;background:#111;color:#fff;cursor:pointer}
@media print{button,a.lien{display:none}}
</style>
</head>
<body>
<div class="card" id="card"><p>Vérification du billet…</p></div>
<script>
const API="https://script.google.com/macros/s/AKfycbwDtRo_nyLeuE9rSu3J2qfFGE-etCtvU8zb0t5X10EG3kx1_9ucdlfPMEkmErmoTHGt/exec";
const p=new URLSearchParams(location.search);
const id=(p.get('id')||'').trim(), nom=p.get('nom')||'';
const card=document.getElementById('card');
const echap=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

if(!id){
  card.innerHTML='<h2 class="ko">Billet introuvable</h2><a class="lien" href="index.html">Retour à l’accueil</a>';
}else{
  fetch(API+'?id='+encodeURIComponent(id)).then(r=>r.json()).then(d=>{
    const s=String(d.statut||'').trim();
    if(/^pay/i.test(s)){
      let qr='';
      try{const q=qrcode(0,'M');q.addData(id);q.make();qr=q.createImgTag(5,8)}catch(e){}
      card.innerHTML='<h1 class="ok">✅ Billet confirmé</h1><div class="code">'+echap(id)+'</div>'
        +(d.evenement?'<p><b>'+echap(d.evenement)+'</b></p>':'')
        +'<p>Au nom de '+echap(d.nom||nom)+'</p><div>'+qr+'</div>'
        +'<p class="ok">Valide à l’entrée. Présentez ce billet à l’accueil.</p>'
        +'<button onclick="window.print()">Imprimer / enregistrer</button>'
        +'<a class="lien" href="index.html">Retour à l’accueil</a>';
    }else if(s==='Non trouvé'){
      card.innerHTML='<h2 class="ko">Commande introuvable</h2><a class="lien" href="index.html">Retour à l’accueil</a>';
    }else{
      card.innerHTML='<h2 class="ko">Paiement non confirmé</h2><p>Statut : '+echap(s)+'</p>'
        +'<a class="lien" href="paiement.html?id='+encodeURIComponent(id)+'&nom='+encodeURIComponent(nom)+'">Retour au paiement</a>';
    }
  }).catch(()=>{card.innerHTML='<p>Impossible de vérifier pour le moment. Réessayez.</p>'});
}
</script>
</body>
</html>
