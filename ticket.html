<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket</title>
<style>body{font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; background:#f5f5f5} .card{background:white; padding:30px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.1); text-align:center; max-width:400px; width:90%}</style>
</head>
<body>
<div class="card">
  <h1 style="color:#e11d48" id="t">✅ Billet Confirmé</h1>
  <h2 id="code" style="letter-spacing:2px; font-size:32px; margin:10px 0"></h2>
  <p id="nom"></p>
  <p style="color:green; margin-top:15px">Valide à l'entrée</p>
  <button onclick="window.print()" style="margin-top:20px; padding:12px 20px; background:black; color:white; border:none; border-radius:8px; width:100%">Imprimer / PDF</button>
  <a href="index.html" style="display:block; margin-top:15px; color:#666">Retour</a>
</div>
<script>
  const p = new URLSearchParams(location.search);
  document.getElementById('code').textContent = p.get('id') || 'DTM-XXXX';
  document.getElementById('nom').textContent = 'Au nom de: ' + (p.get('nom') || 'Client');
</script>
</body>
</html>
