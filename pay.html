<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Paiement DTM</title>
<style>body{font-family:sans-serif;text-align:center;padding:30px} .box{border:1px solid #ccc;padding:20px;border-radius:12px;max-width:400px;margin:auto}</style>
</head><body>
<div class="box" id="app">Chargement...</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2eHLMpO6617-jwHj5xaSDzGSTFpEvYMTeNNwd6bDo8jHR6Z8y-_6FY_WRQUW_PYbp/exec?list=all";
const params = new URLSearchParams(window.location.search);
const id = params.get('id');

async function load(){
  if(!id){ document.getElementById('app').innerText="Lien invalide, pas d'ID"; return; }
  try{
    const r = await fetch(SCRIPT_URL + "?id=" + encodeURIComponent(id));
    const j = await r.json();
    if(j.statut === "Non trouvé"){ document.getElementById('app').innerHTML = "Commande introuvable. Vérifiez votre lien.<br>ID cherché: "+id; return; }
    
    document.getElementById('app').innerHTML = `
      <h2>Finalisez votre paiement</h2>
      <p>Commande <b>${j.id}</b> pour ${j.nom}</p>
      <p>Orange Money :<br><b>+243852862455</b><br>Montant : 10 $<br>Référence : ${j.id}</p>
      <button onclick="payer()" style="background:green;color:white;padding:15px;border:none;border-radius:8px;width:100%;font-size:16px">J'ai payé, envoyer la preuve sur WhatsApp</button>
      <p style="margin-top:15px;font-size:13px">Statut actuel : ${j.statut}</p>
    `;
  }catch(e){ document.getElementById('app').innerText="Erreur de chargement: "+e; }
}

async function payer(){
  await fetch(SCRIPT_URL, {method:"POST", body: JSON.stringify({id:id, action:"preuve_envoyee"})});
  window.location.href = "https://wa.me/243852862455?text=Preuve%20de%20paiement%20pour%20"+encodeURIComponent(id);
}
load();
</script>
</body></html>
